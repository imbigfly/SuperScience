[workspace]
resolver = "2"
members = [
    "crates/superscience-llm",
    "crates/superscience-core",
    "crates/superscience-tools",
    "crates/superscience-store",
    "crates/superscience-skills",
    "crates/superscience-runtime",
    "crates/superscience-mcp",
    "crates/superscience-acp",
    "crates/superscience-cli",
    "crates/superscience-paths",
    "crates/superscience-sync",
    "src-tauri",
]
default-members = ["crates/superscience-cli"]

[workspace.package]
version = "0.30.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["SuperScience contributors"]
repository = "https://github.com/xuzhougeng/wisp-science"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
agent-client-protocol = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# system-proxy: honor Windows/macOS system proxy settings (clash etc., #77);
# socks: support socks5:// proxy URLs from env/system config.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy", "socks"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
glob = "0.3"
walkdir = "2"
same-file = "1"
dunce = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
portable-pty = "0.9"
flate2 = "1"
hex = "0.4"
ring = "0.17"
sha2 = "0.10"
tar = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
keyring = "3"
superscience-llm = { path = "crates/superscience-llm" }
superscience-core = { path = "crates/superscience-core" }
superscience-tools = { path = "crates/superscience-tools" }
superscience-store = { path = "crates/superscience-store" }
superscience-skills = { path = "crates/superscience-skills" }
superscience-runtime = { path = "crates/superscience-runtime" }
superscience-mcp = { path = "crates/superscience-mcp" }
superscience-acp = { path = "crates/superscience-acp" }
superscience-paths = { path = "crates/superscience-paths" }
superscience-sync = { path = "crates/superscience-sync" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
