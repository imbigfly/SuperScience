[package]
name = "superscience-mcp"
description = "Minimal stdio JSON-RPC MCP client; launches vendored bio-tools servers via uv."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
tracing = { workspace = true }
superscience-llm = { workspace = true }
superscience-tools = { workspace = true }
superscience-paths = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[test]]
name = "process_tree_shutdown"
path = "tests/process_tree_shutdown.rs"
harness = false
