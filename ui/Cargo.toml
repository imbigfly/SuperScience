[package]
name = "superscience-ui"
description = "superscience desktop UI (Leptos CSR, built by Trunk, loaded in the Tauri WebView2)."
version = "1.7.1"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "superscience-ui"
path = "src/main.rs"

[dependencies]
superscience-dto = { path = "../crates/superscience-dto" }
superscience-paths = { path = "../crates/superscience-paths" }
leptos = { version = "0.6", features = ["csr", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "InputEvent", "KeyboardEvent", "MouseEvent", "WheelEvent", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement", "HtmlElement", "Window", "Document", "Element", "Node", "DomTokenList", "Navigator", "Clipboard", "Selection", "Storage", "DomRect", "CustomEvent", "CustomEventInit"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"

# Standalone workspace: this crate compiles to wasm32 for the Tauri WebView,
# separate from the native Cargo workspace at the repo root.
[workspace]

# wasm32 defaults to abort; unwind lets install_panic_hook keep the renderer
# alive after an OwnerDisposed race in a keyed row. "s" matches the desktop
# size budget; the built-in release default (opt-level 3) bloated the bundle
# shipped inside the app. No LTO: wasm-ld link time dominates trunk builds.
[profile.release-wasm]
inherits = "release"
opt-level = "s"
panic = "unwind"
