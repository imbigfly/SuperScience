# Linux/arm64 webkit2gtk 2.52.3 cannot expose wasm externref tables (upstream
# v1.2.0). Enabling `-C target-feature=-reference-types` here also breaks
# macOS Trunk + wasm-bindgen 0.2.127 (`__wbindgen_externref_table_alloc`).
# This fork packages macOS locally; keep the Linux workaround in CI only.
#
# [target.wasm32-unknown-unknown]
# rustflags = ["-C", "target-feature=-reference-types"]
