name: Sync Vendor Skills

# Maintainer helper: sync allowlisted vendor skill packs into the bundled
# skills/ tree. Runs on a GitHub runner because codeload.github.com is much
# faster there than from a typical local link.

on:
  workflow_dispatch:
  # Temporary branch trigger for the initial sync; remove after the run.
  push:
    branches: [ci/sync-vendor-skills]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/sync-vendor-skills

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync vendored skill packs
        run: python3 scripts/sync_vendor_skills.py

      - name: Validate bundled skills
        run: cargo test -p superscience-skills bundled_skills_do_not_depend_on_the_legacy_host_sdk

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills crates/superscience-skills/src/update.rs
          if git diff --cached --quiet; then
            echo "no skill changes"
            exit 0
          fi
          git commit -m "chore(skills): sync vendor packs to latest upstream"
          git push origin HEAD:ci/sync-vendor-skills
