name: Linux Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/wait-for-release
          path: _release_ci

      - name: Wait for GitHub release
        id: release
        uses: ./_release_ci/.github/actions/wait-for-release
        with:
          tag: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      # wasm-bindgen-cli must stay pinned at 0.2.96 with the repo's wrapper
      # installed over it: webkit2gtk 2.52.3 on aarch64 cannot expose externref
      # tables, so the wasm must be built without reference-types. See
      # scripts/wasm-bindgen-wrapper.sh for the full explanation. Pulled from
      # the release assets instead of cargo install (10+ min compile).
      - name: Install pinned wasm-bindgen
        run: |
          set -euo pipefail
          case "${{ runner.arch }}" in
            ARM64) WBG_TARGET=aarch64-unknown-linux-gnu ;;
            X64)   WBG_TARGET=x86_64-unknown-linux-gnu ;;
            *) echo "::error::Unsupported arch ${{ runner.arch }}" >&2; exit 1 ;;
          esac
          if ! command -v wasm-bindgen.real >/dev/null 2>&1 || ! wasm-bindgen.real --version | grep -q '0\.2\.96'; then
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            curl -fsSL --retry 3 -o "$TMP/wbg.tar.gz" \
              "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.96/wasm-bindgen-0.2.96-${WBG_TARGET}.tar.gz"
            tar -xzf "$TMP/wbg.tar.gz" -C "$TMP"
            install -m 0755 "$(find "$TMP" -type f -name wasm-bindgen | head -1)" \
              "$HOME/.cargo/bin/wasm-bindgen.real"
          fi
          ln -sf "$GITHUB_WORKSPACE/scripts/wasm-bindgen-wrapper.sh" "$HOME/.cargo/bin/wasm-bindgen"
          wasm-bindgen.real --version

      # Baked into the binary via option_env! so installed apps can send feedback
      # without a sidecar feedback.local.toml. Never commit the password.
      - name: Require feedback SMTP password secret
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        run: |
          if [ -z "${SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD:-}" ]; then
            echo "::error::Set repository secret SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD (Feishu mailbox client password) so release builds can send feedback email." >&2
            exit 1
          fi

      # No updater artifacts on Linux: the macOS workflow owns latest.json.
      # Pass releaseId so tauri-action uploads assets without rewriting notes.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          releaseId: ${{ steps.release.outputs.release-id }}
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles deb,appimage

  verify-assets:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Verify both architectures published deb and AppImage
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          debs=$(grep -c '\.deb$' assets.txt || true)
          appimages=$(grep -c '\.AppImage$' assets.txt || true)
          if [ "$debs" -lt 2 ] || [ "$appimages" -lt 2 ]; then
            echo "::error::Expected >=2 .deb and >=2 .AppImage assets, got $debs deb / $appimages AppImage"
            exit 1
          fi
