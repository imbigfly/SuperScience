name: macOS Build

# Manual diagnostic/packaging build (unsigned app + dmg). Not tied to push —
# release packages only come from release-macos.yml on a version tag.
on:
  workflow_dispatch:
  # Temporary: rebuild with the synced skills; removed after the run starts.
  push:
    branches: [ci/final-build]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      - name: Cache Cua Driver
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: cua-driver-${{ runner.os }}-${{ runner.arch }}-0.37.0

      - name: Fetch Cua Driver
        shell: bash
        run: bash scripts/fetch_cua_driver.sh

      - uses: tauri-apps/tauri-action@v1
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          uploadWorkflowArtifacts: true
          args: --bundles app,dmg
