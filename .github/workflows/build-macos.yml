name: macOS Build

# Manual diagnostic/packaging build (ad-hoc signed app + dmg). Not tied to push —
# release packages only come from release-macos.yml on a version tag.
on:
  workflow_dispatch:
  # Temporary: retry with fixed artifact discovery.
  push:
    branches: [ci/pymol-build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      - name: Cache Cua Driver
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: cua-driver-${{ runner.os }}-${{ runner.arch }}-0.37.0

      - name: Fetch Cua Driver
        shell: bash
        run: bash scripts/fetch_cua_driver.sh

      - uses: tauri-apps/tauri-action@v1
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          uploadWorkflowArtifacts: true
          args: --bundles app

      - name: Sign and package DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) ARCH=aarch64 ;; x86_64) ARCH=x86_64 ;; esac
          APP="$(find target src-tauri/target -path '*/bundle/macos/*.app' -type d 2>/dev/null | head -1 || true)"
          if [ -z "$APP" ]; then
            APP="$(find . -maxdepth 8 -path '*/bundle/macos/*.app' -type d 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$APP" ]; then
            echo "::error::macOS app bundle was not found"
            find . -maxdepth 8 -name '*.app' -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "signing $APP"
          if ! OUT="$(codesign --force --sign - --identifier science.superscience "$APP" 2>&1)"; then
            echo "::warning::codesign failed, retrying with --deep: $OUT"
            OUT="$(codesign --force --deep --sign - --identifier science.superscience "$APP" 2>&1)" || {
              echo "::error::codesign failed: $OUT"
              exit 1
            }
          fi
          if ! OUT="$(codesign --verify --deep --strict --verbose=2 "$APP" 2>&1)"; then
            echo "::warning::deep codesign verification failed: $OUT"
            OUT="$(codesign --verify --strict --verbose=2 "$APP" 2>&1)" || {
              echo "::error::codesign verification failed: $OUT"
              exit 1
            }
          fi
          mkdir -p out
          if ! OUT="$(hdiutil create -volname "天成科研助手" -srcfolder "$APP" -ov -format UDZO "out/SuperScience-${VERSION}-macos-${ARCH}.dmg" 2>&1)"; then
            echo "::error::hdiutil create failed: $OUT"
            exit 1
          fi
          ls -lh "out/SuperScience-${VERSION}-macos-${ARCH}.dmg"

      - name: Publish to ci-latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) ARCH=aarch64 ;; x86_64) ARCH=x86_64 ;; esac
          DMG="out/SuperScience-${VERSION}-macos-${ARCH}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::DMG not found: $DMG"
            ls -l out || true
            exit 1
          fi
          if ! gh release view ci-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ci-latest -R "$GITHUB_REPOSITORY" --prerelease \
              --title "CI latest installers" \
              --notes "Automated installer artifacts from the latest packaging runs." || true
          fi
          if ! OUT="$(gh release upload ci-latest -R "$GITHUB_REPOSITORY" "$DMG" --clobber 2>&1)"; then
            echo "::error::gh release upload failed: $OUT"
            exit 1
          fi
          gh release view ci-latest -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
