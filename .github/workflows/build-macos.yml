name: macOS Build

# Manual diagnostic/packaging build (ad-hoc signed app + dmg). Not tied to push —
# release packages only come from release-macos.yml on a version tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      - name: Cache Cua Driver
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: cua-driver-${{ runner.os }}-${{ runner.arch }}-0.37.0

      - name: Fetch Cua Driver
        shell: bash
        run: bash scripts/fetch_cua_driver.sh

      - uses: tauri-apps/tauri-action@v1
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          uploadWorkflowArtifacts: true
          args: --bundles app

      - name: Build standard DMG
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo tauri bundle --bundles dmg --config tauri.macos.sign.conf.json
          VERSION="$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')"
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) ARCH=aarch64 ;; x86_64) ARCH=x86_64 ;; esac
          DMG="$(find ../target target -path '*/bundle/dmg/*.dmg' -type f 2>/dev/null | head -1 || true)"
          if [ -z "$DMG" ]; then
            echo "::error::Tauri DMG was not found"
            find .. -maxdepth 8 -path '*/bundle/dmg/*.dmg' -type f 2>/dev/null | head -20
            exit 1
          fi
          mkdir -p ../out
          cp "$DMG" "../out/SuperScience-${VERSION}-macos-${ARCH}.dmg"
          ls -lh "../out/SuperScience-${VERSION}-macos-${ARCH}.dmg"

      - name: Publish to ci-latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) ARCH=aarch64 ;; x86_64) ARCH=x86_64 ;; esac
          DMG="out/SuperScience-${VERSION}-macos-${ARCH}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::DMG not found: $DMG"
            ls -l out || true
            exit 1
          fi
          if ! gh release view ci-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ci-latest -R "$GITHUB_REPOSITORY" --prerelease \
              --title "CI latest installers" \
              --notes "Automated installer artifacts from the latest packaging runs." || true
          fi
          if ! OUT="$(gh release upload ci-latest -R "$GITHUB_REPOSITORY" "$DMG" --clobber 2>&1)"; then
            echo "::error::gh release upload failed: $OUT"
            exit 1
          fi
          gh release view ci-latest -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
