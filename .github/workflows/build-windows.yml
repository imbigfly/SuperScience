name: Windows Build

# Manual diagnostic/packaging build (nsis). Not tied to push — release
# packages only come from release-windows.yml on a version tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      - name: Cache Cua Driver
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: cua-driver-${{ runner.os }}-${{ runner.arch }}-0.37.0

      - name: Fetch Cua Driver
        shell: bash
        run: bash scripts/fetch_cua_driver.sh

      - uses: tauri-apps/tauri-action@v1
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          uploadWorkflowArtifacts: true
          args: --bundles nsis

      - name: Publish to ci-latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          EXE="$(find target src-tauri/target -path '*/bundle/nsis/*.exe' -type f 2>/dev/null | head -1)"
          test -n "$EXE"
          mkdir -p out
          cp "$EXE" "out/SuperScience-${VERSION}-windows-x64-setup.exe"
          gh release view ci-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-latest -R "$GITHUB_REPOSITORY" --prerelease \
              --title "CI latest installers" \
              --notes "Automated installer artifacts from the latest packaging runs."
          gh release upload ci-latest -R "$GITHUB_REPOSITORY" \
            "out/SuperScience-${VERSION}-windows-x64-setup.exe" --clobber
