name: CI Installers

# Temporary multi-platform packaging workflow for unsigned test builds.
# Push to ci/build-installers triggers macOS (arm64 + x64) and Windows (x64)
# builds and publishes the installers to the `ci-installers` prerelease so
# they can be downloaded without a GitHub login. Delete this branch when done.

on:
  push:
    branches: [ci/build-installers]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-installers
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # Serial so the two DMGs do not race the shared cargo cache.
      max-parallel: 1
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      - name: Build macOS bundle
        uses: tauri-apps/tauri-action@v1
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles app,dmg

      - name: Collect DMG
        run: |
          set -euo pipefail
          mkdir -p out
          find "target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: out/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Install Trunk and Tauri CLI
        uses: ./.github/actions/install-tauri-tools

      - name: Build Windows installers
        shell: pwsh
        env:
          SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD: ${{ secrets.SUPERSCIENCE_FEEDBACK_SMTP_PASSWORD }}
        run: cargo tauri build --bundles msi,nsis

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "target/release/bundle/msi/*.msi" out/
          Copy-Item "target/release/bundle/nsis/*.exe" out/
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            out/*.msi
            out/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show collected installers
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Publish installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view ci-installers --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ci-installers --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "CI installers (unsigned)" \
              --notes "Unsigned test builds from commit ${GITHUB_SHA}."
          fi
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 \
            | xargs -0 gh release upload ci-installers --repo "$GITHUB_REPOSITORY" --clobber
