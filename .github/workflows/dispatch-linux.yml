name: Dispatch Linux Release

# Temporary bridge: the Linux release workflow is not present on the default
# branch, so GitHub does not show its "Run workflow" button. This push-triggered
# helper dispatches it on the release branch. Removed after the v1.12.1 run.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Linux Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' '{"ref":"local/brand-tiancheng","inputs":{"tag":"v1.12.1"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/404120727/dispatches" --input -
